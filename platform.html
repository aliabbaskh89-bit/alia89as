<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكورسات | علي عباس</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B2EJSHP00Q"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-B2EJSHP00Q');</script>
    <link rel="manifest" href="/manifest-platform.json">
    <meta name="theme-color" content="#c8f135">
    <link rel="apple-touch-icon" href="/profile.jpg">
    <link rel="preload" href="font/GraphikArabic-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="font/GraphikArabic-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="platform.css">
</head>
<body id="platformPage">

    <!-- ── Replies Drawer (slide in from right) ─── -->
    <div id="repliesDrawer" class="replies-drawer">
        <div class="drawer-header">
            <h3>📬 ردود المدرب على أسئلتي</h3>
            <button onclick="closeReplies()" class="drawer-close">✕</button>
        </div>
        <div id="repliesList" class="replies-list"></div>
    </div>
    <div id="drawerOverlay" class="drawer-overlay" onclick="closeReplies()"></div>

    <!-- ── Header ──────────────────────────────────── -->
    <header class="platform-header">
        <div class="header-brand">
            <img src="profile.jpg" alt="علي عباس" class="header-avatar">
            <span>منصة علي عباس</span>
        </div>
        <div class="header-student">
            <button id="repliesBtn" class="btn-replies" onclick="openReplies()" title="ردود المدرب">
                📬
                <span id="repliesBadge" class="replies-badge" style="display:none">0</span>
            </button>
            <button id="activateBtnHeader" onclick="openActivateModal()" style="padding:6px 12px; background:rgba(200,241,53,0.15); border:1px solid #c8f135; color:#c8f135; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.82rem; font-family:inherit; margin-left:8px;">
                ✨ تفعيل كورس
            </button>
            <span>مرحباً، <strong id="studentName"></strong></span>
            <button id="logoutBtn" class="btn-logout">خروج</button>
        </div>
    </header>

    <!-- ── Code Activation Modal ─── -->
    <div id="activateModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:20px;">
        <div style="background:#18181b; border:1px solid rgba(200,241,53,0.3); border-radius:16px; padding:24px; max-width:440px; width:100%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.6);">
            <div style="font-size:36px; margin-bottom:10px;">✨</div>
            <h3 style="color:#fff; font-size:1.2rem; margin-bottom:6px;">تفعيل كورس جديد</h3>
            <p style="color:rgba(255,255,255,0.7); font-size:0.85rem; margin-bottom:20px;">أدخل كود الاشتراك المكون من حروف وأرقام المأخوذ من المدرب</p>
            <form id="activateCodeForm" onsubmit="handleActivateCode(event)">
                <input type="text" id="activateInput" placeholder="أدخل كود التفعيل هنا" style="width:100%; padding:12px; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:1rem; text-align:center; margin-bottom:14px; font-family:inherit;" required>
                <p id="activateError" style="color:#f87171; font-size:0.82rem; margin-bottom:12px; display:none;"></p>
                <div style="display:flex; gap:10px;">
                    <button type="button" onclick="closeActivateModal()" style="flex:1; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:transparent; color:#fff; cursor:pointer; font-family:inherit;">إلغاء</button>
                    <button type="submit" id="btnActivateSubmit" class="btn-primary" style="flex:2; padding:10px; border-radius:8px; cursor:pointer;">تفعيل الكورس 🚀</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ── Main Layout ──────────────────────────────── -->
    <div class="platform-layout">

        <!-- Sidebar -->
        <aside class="platform-sidebar">
            <p class="sidebar-title">كورساتي</p>
            <div id="coursesList"></div>
        </aside>

        <!-- Main area -->
        <main class="platform-main">

            <!-- Welcome screen -->
            <div id="welcomeScreen" class="welcome-screen">
                <div class="welcome-icon">🎬</div>
                <h2 id="welcomeTitle">اختر محاضرة للبدء</h2>
                <p id="welcomeSub">اختر الكورس من القائمة على اليمين ثم اضغط على المحاضرة</p>
            </div>

            <!-- Video player -->
            <div id="playerArea" style="display:none">
                <h2 id="lessonTitle" class="current-lesson-title"></h2>

                <div class="video-wrapper" id="videoPlayerContainer">
                    <video
                        id="videoPlayer"
                        controls
                        controlslist="nodownload"
                        oncontextmenu="return false"
                    ></video>
                    <div id="videoWatermark" class="video-watermark"></div>
                </div>

                <!-- Notes & Questions -->
                <div class="notes-section">
                    <div class="notes-header">
                        <h3>📝 ملاحظاتي وأسئلتي</h3>
                        <p>خاصة بك فقط — تصل مباشرة للمدرب ولا يراها أحد غيرك</p>
                    </div>
                    <div id="notesList" class="notes-list"></div>
                    <form id="addNoteForm" class="add-note-form">
                        <textarea id="noteText" placeholder="اكتب ملاحظتك أو سؤالك هنا..." rows="3"></textarea>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <button type="button" onclick="document.getElementById('noteFile').click()" style="padding:8px 14px;border-radius:8px;border:1px dashed #6b7280;background:transparent;color:#9ca3af;font-size:.85rem;cursor:pointer;font-family:inherit;">📎 <span id="attachLabel">إرفاق ملف أو صورة</span></button>
                            <input type="file" id="noteFile" accept="image/*,application/pdf" style="position:absolute;opacity:0;width:0;height:0;" onchange="document.getElementById('attachLabel').textContent=this.files[0]?this.files[0].name:'إرفاق ملف أو صورة'">
                        </div>
                        <button type="submit" id="noteSubmitBtn" class="btn-primary" style="max-width:180px; align-self:flex-start">
                            إرسال للمدرب
                        </button>
                    </form>
                </div>
            </div>

            <!-- Lessons list -->
            <div id="lessonsList" class="lessons-list" style="display:none"></div>

        </main>
    </div>

    <script src="platform.js"></script>
</body>
</html>
