<!DOCTYPE html>
<html>
<head>
<style>
body { background: black; margin: 0; height: 2000px; }
.platform-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
}
.particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    animation: float 2s linear infinite;
}
@keyframes float {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>
    <div class="platform-particles" id="p"></div>
    <script>
        const c = document.getElementById('p');
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = '50vw';
        c.appendChild(p);
    </script>
</body>
</html>
