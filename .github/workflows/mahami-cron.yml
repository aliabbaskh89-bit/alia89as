name: مهامي — منبّه التذكير

# كل 5 دقائق ينادي دالة الإرسال على Vercel؛ هي تقرر منو وصل وقت تذكيره (الصباحي أو وقت مهمة).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tasks-app/deploy-url.txt
          sparse-checkout-cone-mode: false
      - name: نداء /api/cron
        run: |
          URL="${{ vars.MAHAMI_URL }}"
          [ -z "$URL" ] && URL="$(tr -d '[:space:]' < tasks-app/deploy-url.txt)"
          if [ -z "$URL" ]; then echo "رابط مهامي على Vercel مو محدد بعد (tasks-app/deploy-url.txt)"; exit 0; fi
          curl -sS --max-time 60 --retry 2 "${URL%/}/api/cron"
